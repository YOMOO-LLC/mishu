name: Feature request
description: Propose a change to the MIT engine, contracts, adapters, examples, or headless host.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Official builds keep AI disclosure, calling hours, DNC, and consent on by default.
        Requests whose purpose is to hide that the speaker is an AI, spoof caller ID, or
        place unconsented bulk calls will be closed under AUP.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Desired /v1 behavior, port, or UI. Reference ADRs when you can.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Primary surface
      options:
        - packages/core or contracts
        - adapters (mock or cloud-reference)
        - apps/cloud headless host
        - desktop local engine
        - examples or docs
        - other
    validations:
      required: true
  - type: checkboxes
    id: guards
    attributes:
      label: Confirm
      options:
        - label: This feature can be tested with mocks and +1555… numbers.
          required: true
        - label: This does not add a way to disable AI disclosure in official builds.
          required: true
